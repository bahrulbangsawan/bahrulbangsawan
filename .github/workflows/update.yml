name: Update profile artwork

on:
  schedule:
    - cron: "17 22 * * *" # daily, early morning in Indonesia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the SVGs from live GitHub and bahrul.me data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_assets.py
      - name: Commit what changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets scripts/site-cache.json
          git diff --cached --quiet || git commit -m "Update profile artwork"
          git push
