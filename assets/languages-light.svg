<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320" role="img" aria-labelledby="t d">
  <title id="t">Languages across public repositories</title>
  <desc id="d">Rust 40.7%, TypeScript 35.7%, Python 8.5%, HTML 7.3%, JavaScript 3.7%, Other 4.1%</desc>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
    .num { font-variant-numeric: tabular-nums; }
    .fu { animation: fu .7s cubic-bezier(.2,.7,.2,1) both; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes fu { from { opacity: 0; transform: translateY(10px); } }
    @keyframes pulse { 50% { opacity: .35; } }
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow .9s cubic-bezier(.2,.7,.2,1) both; } @keyframes grow { from { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .cover { display: none; }
    }
  </style>
  <rect x="0.5" y="0.5" width="619" height="319" rx="16" fill="#faf9f6" stroke="#dedcd8"/>
  <circle class="pulse" cx="40" cy="49.6" r="4" fill="#c10007"/>
  <text x="54" y="54" class="mono" font-size="13" font-weight="600" letter-spacing="2.1" fill="#c10007">LANGUAGES</text>
  <text x="584" y="54" class="sans num" font-size="15" text-anchor="end" fill="#5e5d5a">by code size in <tspan font-weight="700" fill="#1e1e1d">18</tspan> public repos</text>
  <text x="36" y="109" class="sans" font-size="16" fill="#1e1e1d">Rust</text>
  <rect class="bar" style="animation-delay:0.20s" x="168" y="99" width="330.0" height="10" rx="5" fill="#1e1e1d"/>
  <text x="584" y="109" class="sans num" font-size="15" text-anchor="end" fill="#5e5d5a">40.7%</text>
  <text x="36" y="142" class="sans" font-size="16" fill="#1e1e1d">TypeScript</text>
  <rect class="bar" style="animation-delay:0.28s" x="168" y="132" width="289.4" height="10" rx="5" fill="#1e1e1d"/>
  <text x="584" y="142" class="sans num" font-size="15" text-anchor="end" fill="#5e5d5a">35.7%</text>
  <text x="36" y="175" class="sans" font-size="16" fill="#1e1e1d">Python</text>
  <rect class="bar" style="animation-delay:0.36s" x="168" y="165" width="69.2" height="10" rx="5" fill="#1e1e1d"/>
  <text x="584" y="175" class="sans num" font-size="15" text-anchor="end" fill="#5e5d5a">8.5%</text>
  <text x="36" y="208" class="sans" font-size="16" fill="#1e1e1d">HTML</text>
  <rect class="bar" style="animation-delay:0.44s" x="168" y="198" width="59.1" height="10" rx="5" fill="#1e1e1d"/>
  <text x="584" y="208" class="sans num" font-size="15" text-anchor="end" fill="#5e5d5a">7.3%</text>
  <text x="36" y="241" class="sans" font-size="16" fill="#1e1e1d">JavaScript</text>
  <rect class="bar" style="animation-delay:0.52s" x="168" y="231" width="29.9" height="10" rx="5" fill="#1e1e1d"/>
  <text x="584" y="241" class="sans num" font-size="15" text-anchor="end" fill="#5e5d5a">3.7%</text>
  <text x="36" y="274" class="sans" font-size="16" fill="#1e1e1d">Other</text>
  <rect class="bar" style="animation-delay:0.60s" x="168" y="264" width="33.1" height="10" rx="5" fill="#6f6e6b"/>
  <text x="584" y="274" class="sans num" font-size="15" text-anchor="end" fill="#5e5d5a">4.1%</text>
</svg>
