<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 256" width="620" height="256" role="img" aria-labelledby="t d">
  <title id="t">Claude Pool</title>
  <desc id="d">Switch between Claude Code accounts and see every account's usage limits at a glance.</desc>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
    .num { font-variant-numeric: tabular-nums; }
    .fu { animation: fu .7s cubic-bezier(.2,.7,.2,1) both; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes fu { from { opacity: 0; transform: translateY(10px); } }
    @keyframes pulse { 50% { opacity: .35; } }
    
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .cover { display: none; }
    }
  </style>
  <rect x="0.5" y="0.5" width="619" height="255" rx="16" fill="#121212" stroke="#2e2e2d"/>
  <circle class="pulse" cx="40" cy="49.6" r="4" fill="#ff6467"/>
  <text x="54" y="54" class="mono" font-size="13" font-weight="600" letter-spacing="2.1" fill="#ff6467">SWIFT · MENU BAR APP</text>
  <text x="35" y="108" class="sans" font-size="36" font-weight="700" letter-spacing="-1.1" fill="#faf9f6">Claude Pool</text>
  <text x="36" y="146" class="sans" font-size="19" fill="#b4b4b2">Switch between Claude Code accounts and see</text>
  <text x="36" y="174" class="sans" font-size="19" fill="#b4b4b2">every account's usage limits at a glance.</text>
  <line x1="36" y1="204" x2="584" y2="204" stroke="#2e2e2d"/>
  <text x="36" y="231" class="mono" font-size="13" fill="#8e8e8c">bahrulbangsawan/claude-pool</text>
  <text x="584" y="231" class="sans" font-size="14" font-weight="600" text-anchor="end" fill="#faf9f6">View repo →</text>
</svg>
