<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 256" width="620" height="256" role="img" aria-labelledby="t d">
  <title id="t">Manuju Jaya MCP</title>
  <desc id="d">A remote MCP server that gives AI assistants read-only access to live Qasir POS data.</desc>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
    .num { font-variant-numeric: tabular-nums; }
    .fu { animation: fu .7s cubic-bezier(.2,.7,.2,1) both; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes fu { from { opacity: 0; transform: translateY(10px); } }
    @keyframes pulse { 50% { opacity: .35; } }
    
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .cover { display: none; }
    }
  </style>
  <rect x="0.5" y="0.5" width="619" height="255" rx="16" fill="#faf9f6" stroke="#dedcd8"/>
  <circle class="pulse" cx="40" cy="49.6" r="4" fill="#c10007"/>
  <text x="54" y="54" class="mono" font-size="13" font-weight="600" letter-spacing="2.1" fill="#c10007">CLOUDFLARE WORKERS · MCP</text>
  <text x="35" y="108" class="sans" font-size="36" font-weight="700" letter-spacing="-1.1" fill="#1e1e1d">Manuju Jaya MCP</text>
  <text x="36" y="146" class="sans" font-size="19" fill="#5e5d5a">A remote MCP server that gives AI assistants</text>
  <text x="36" y="174" class="sans" font-size="19" fill="#5e5d5a">read-only access to live Qasir POS data.</text>
  <line x1="36" y1="204" x2="584" y2="204" stroke="#dedcd8"/>
