<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 176" width="1280" height="176" role="img" aria-labelledby="t d">
  <title id="t">Work in numbers, from bahrul.me</title>
  <desc id="d">Projects Shipped: 33 live on bahrul.me; Clients: 23 businesses worked with; Case Studies: 6 written up in detail; Years In The Field: 10 since 2016</desc>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
    .num { font-variant-numeric: tabular-nums; }
    .fu { animation: fu .7s cubic-bezier(.2,.7,.2,1) both; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .growx, .growy { transform-box: fill-box; animation: 20s cubic-bezier(.2,.7,.2,1) infinite both; }
    .growx { transform-origin: left center; animation-name: growx; }
    .growy { transform-origin: center bottom; animation-name: growy; }
    @keyframes fu { from { opacity: 0; transform: translateY(10px); } }
    @keyframes pulse { 50% { opacity: .35; } }
    @keyframes growx { 0% { transform: scaleX(0); opacity: 0; } 1% { opacity: 1; } 7% { transform: scaleX(1); } 95% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes growy { 0% { transform: scaleY(0); opacity: 0; } 1% { opacity: 1; } 7% { transform: scaleY(1); } 95% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }
    
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .cover { display: none; }
    }
  </style>
  <g class="fu" style="animation-delay:0.00s">
    <rect x="0.5" y="0.5" width="307.0" height="175" rx="16" fill="#faf9f6" stroke="#dedcd8"/>
    <text x="28.0" y="46" class="mono" font-size="13" font-weight="600" letter-spacing="2.1" fill="#6f6e6b">PROJECTS SHIPPED</text>
    <text x="26.0" y="112" class="sans num" font-size="58" font-weight="700" letter-spacing="-2" fill="#1e1e1d">33</text>
    <text x="28.0" y="146" class="sans" font-size="17" fill="#5e5d5a">live on bahrul.me</text>
  </g>
  <g class="fu" style="animation-delay:0.09s">
    <rect x="324.5" y="0.5" width="307.0" height="175" rx="16" fill="#faf9f6" stroke="#dedcd8"/>
    <text x="352.0" y="46" class="mono" font-size="13" font-weight="600" letter-spacing="2.1" fill="#6f6e6b">CLIENTS</text>
    <text x="350.0" y="112" class="sans num" font-size="58" font-weight="700" letter-spacing="-2" fill="#1e1e1d">23</text>
    <text x="352.0" y="146" class="sans" font-size="17" fill="#5e5d5a">businesses worked with</text>
  </g>
  <g class="fu" style="animation-delay:0.18s">
    <rect x="648.5" y="0.5" width="307.0" height="175" rx="16" fill="#faf9f6" stroke="#dedcd8"/>
    <text x="676.0" y="46" class="mono" font-size="13" font-weight="600" letter-spacing="2.1" fill="#6f6e6b">CASE STUDIES</text>
    <text x="674.0" y="112" class="sans num" font-size="58" font-weight="700" letter-spacing="-2" fill="#1e1e1d">6</text>
    <text x="676.0" y="146" class="sans" font-size="17" fill="#5e5d5a">written up in detail</text>
  </g>
  <g class="fu" style="animation-delay:0.27s">
    <rect x="972.5" y="0.5" width="307.0" height="175" rx="16" fill="#faf9f6" stroke="#dedcd8"/>
    <text x="1000.0" y="46" class="mono" font-size="13" font-weight="600" letter-spacing="2.1" fill="#6f6e6b">YEARS IN THE FIELD</text>
    <text x="998.0" y="112" class="sans num" font-size="58" font-weight="700" letter-spacing="-2" fill="#1e1e1d">10</text>
    <text x="1000.0" y="146" class="sans" font-size="17" fill="#5e5d5a">since 2016</text>
  </g>
</svg>
