  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
    .num { font-variant-numeric: tabular-nums; }
    .fu { animation: fu .7s cubic-bezier(.2,.7,.2,1) both; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .growx, .growy { transform-box: fill-box; animation: 20s cubic-bezier(.2,.7,.2,1) infinite both; }
    .growx { transform-origin: left center; animation-name: growx; }
    .growy { transform-origin: center bottom; animation-name: growy; }
    @keyframes fu { from { opacity: 0; transform: translateY(10px); } }
    @keyframes pulse { 50% { opacity: .35; } }
    @keyframes growx { 0% { transform: scaleX(0); opacity: 0; } 1% { opacity: 1; } 7% { transform: scaleX(1); } 95% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes growy { 0% { transform: scaleY(0); opacity: 0; } 1% { opacity: 1; } 7% { transform: scaleY(1); } 95% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }
    .r11 { animation-name: r11; } @keyframes r11 { 0% { transform: translateY(-640px); opacity: 0; } 1.5% { opacity: 1; } 10% { transform: translateY(0); } 95% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(0); opacity: 0; } }
    .r12 { animation-name: r12; } @keyframes r12 { 0% { transform: translateY(-704px); opacity: 0; } 1.5% { opacity: 1; } 10% { transform: translateY(0); } 95% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(0); opacity: 0; } }
    .r13 { animation-name: r13; } @keyframes r13 { 0% { transform: translateY(-768px); opacity: 0; } 1.5% { opacity: 1; } 10% { transform: translateY(0); } 95% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(0); opacity: 0; } }
    .r14 { animation-name: r14; } @keyframes r14 { 0% { transform: translateY(-832px); opacity: 0; } 1.5% { opacity: 1; } 10% { transform: translateY(0); } 95% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(0); opacity: 0; } }
    .r17 { animation-name: r17; } @keyframes r17 { 0% { transform: translateY(-1024px); opacity: 0; } 1.5% { opacity: 1; } 10% { transform: translateY(0); } 95% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(0); opacity: 0; } }
    .roll { animation: 20s cubic-bezier(.16,.84,.3,1) infinite both; }
    .flame { transform-box: fill-box; transform-origin: center bottom; animation: flick 1.3s ease-in-out infinite; } .core { transform-box: fill-box; transform-origin: center bottom; animation: flick .9s ease-in-out infinite reverse; } @keyframes flick { 0%, 100% { transform: scale(1, 1) rotate(0); } 30% { transform: scale(.94, 1.07) rotate(-2deg); } 65% { transform: scale(1.05, .95) rotate(2deg); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .cover { display: none; }
    }
