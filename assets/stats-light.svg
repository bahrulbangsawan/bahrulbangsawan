  <title id="t">GitHub activity in numbers, compared with the year before</title>
  <desc id="d">Contributions: 8,074, 39 the year before (207×); Current Streak: 17, days in a row · 1 last time (+16 days); Longest Streak: 34, days · 4 the year before (+30 days); Busiest Day: 346, Oct 24 · 10 the year before (35×)</desc>
