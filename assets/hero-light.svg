    .num { font-variant-numeric: tabular-nums; }
    .fu { animation: fu .7s cubic-bezier(.2,.7,.2,1) both; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes fu { from { opacity: 0; transform: translateY(10px); } }
    @keyframes pulse { 50% { opacity: .35; } }
    .c0 { animation: t0 0.33s steps(6) 0.90s both, gone .01s linear 1.23s forwards; } @keyframes t0 { to { transform: translateX(76px); } }
    .p0 { animation: gone .01s linear 0.65s forwards; }
