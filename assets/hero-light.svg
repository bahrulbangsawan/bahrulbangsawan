    .p2 { animation: gone .01s linear 1.73s forwards; }
    .c3 { animation: gone .01s linear 2.94s forwards; }
    .c4 { animation: t4 0.77s steps(14) 3.39s both, gone .01s linear 4.16s forwards; } @keyframes t4 { to { transform: translateX(158px); } }
    .p4 { animation: gone .01s linear 3.14s forwards; }
    @keyframes gone { to { opacity: 0; } }
    .cursor { opacity: 0; animation: blink 1.1s steps(1) 4.16s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
